[project]
name = "dataset-manager-backend"
version = "0.4.1"
description = "Local-first research dataset management backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0,<2.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pillow>=11.0.0,<13.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "sqlmodel>=0.0.21",
    "uvicorn[standard]>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
